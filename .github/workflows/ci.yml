name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest --cov=orbitops --cov-report=term-missing --cov-report=xml

  airflow:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ runner.temp }}/airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      ORBITOPS_DATA_DIR: ${{ runner.temp }}/orbitops-data
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Airflow with official constraints
        shell: bash
        run: |
          AIRFLOW_VERSION="3.3.0"
          PYTHON_VERSION="${{ matrix.python-version }}"
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          python -m pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"
          python -m pip install -e .
          python -m pip check
      - name: Initialize Airflow metadata database
        run: airflow db migrate
      - name: Validate DAG imports
        shell: bash
        run: |
          airflow dags list-import-errors --output=json > /tmp/import-errors.json
          python - <<'PY'
          import json
          from pathlib import Path

          errors = json.loads(Path("/tmp/import-errors.json").read_text())
          if errors:
              raise SystemExit(f"Airflow DAG import errors: {errors}")
          PY
      - name: Validate DAG task graph
        run: airflow tasks list orbitops_telemetry_pipeline
      - name: Airflow DAG tests
        run: pytest -q tests/airflow
