[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "orbitops-data-lab"
version = "0.2.0"
description = "From raw satellite telemetry to trusted, queryable, anomaly-aware data."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Amir Hossein Alikhah Mishamandani"}]
dependencies = [
  "duckdb>=1.1,<2",
  "pyarrow>=17,<20",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
spark = [
  "pyspark>=4.1,<4.2",
]
dev = [
  "mypy>=1.13,<2",
  "pyspark>=4.1,<4.2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
orbitops = "orbitops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitops"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config -ra"
testpaths = ["tests"]
markers = [
  "integration: end-to-end tests that exercise storage dependencies",
  "spark: tests that require the optional PySpark runtime and Java",
]

[tool.coverage.run]
branch = true
source = ["orbitops"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["orbitops"]
mypy_path = "src"
